<!DSepYPE html>
<html lang="en" th:fragment="layout" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="utf-8"/>
    <title>Dashboard</title>
</head>
<body>

<th:block th:replace="layout/dep-layout :: layout">
    <th:block th:fragment="pageContent">
        <div class="pd-ltr-20 xs-pd-20-10">
            <div class="min-height-200px">
                <div class="page-header">
                    <div class="row">
                        <div class="col-md-12 col-sm-12">
                            <div class="title">
                                <h4>Thông tin cá nhân</h4>
                            </div>
                            <nav aria-label="breadcrumb" role="navigation">
                                <ol class="breadcrumb">
                                    <li class="breadcrumb-item">
                                        <a th:href="@{/}">Home</a>
                                    </li>
                                    <li class="breadcrumb-item active" aria-current="page">
                                        Profile
                                    </li>
                                </ol>
                            </nav>
                        </div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 mb-30">
                        <div class="pd-20 card-box height-100-p">
                            <div class="profile-photo">
                                <a
                                        href="modal"
                                        data-toggle="modal"
                                        data-target="#modal"
                                        class="edit-avatar"
                                ><i class="fa fa-pencil"></i
                                ></a>
                                <img
                                        th:src="@{/assets_admin/vendors/images/photo1.jpg}"
                                        alt=""
                                        class="avatar-photo"
                                />
                                <div
                                        class="modal fade"
                                        id="modal"
                                        tabindex="-1"
                                        role="dialog"
                                        aria-labelledby="modalLabel"
                                        aria-hidden="true"
                                >
                                    <div
                                            class="modal-dialog modal-dialog-centered"
                                            role="document"
                                    >
                                        <div class="modal-content">
                                            <div class="modal-body pd-5">
                                                <div class="img-container">
                                                    <img
                                                            id="image"
                                                            th:src="@{/assets_admin/vendors/images/photo2.jpg}"
                                                            alt="Picture"
                                                    />
                                                </div>
                                            </div>
                                            <div class="modal-footer">
                                                <input
                                                        type="submit"
                                                        value="Update"
                                                        class="btn btn-primary"
                                                />
                                                <button
                                                        type="button"
                                                        class="btn btn-default"
                                                        data-dismiss="modal"
                                                >
                                                    Close
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <h5 class="text-center h5 mb-0" th:text="${employee.fullName}"></h5>
                            <p class="text-center text-muted font-14">
                                <span th:text="${'Phòng ' + employee.department}"></span>

                            </p>
                            <div class="profile-info">
                                <h5 class="mb-20 h5 text-blue">Tổng quan</h5>
                                <ul>
                                    <li>
                                        <span>Email:</span>
                                        <p th:text="${employee.user.email}"></p>
                                    </li>
                                    <li>
                                        <span>Số điện thoại:</span>
                                        <p th:text="${employee.phoneNumber}"></p>
                                    </li>
                                    <li>
                                        <span>Giới tính:</span>
                                        <p th:text="${employee.gender == 'male' ? 'Nam' : 'Nữ'}"></p>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-8 col-lg-8 col-md-8 col-sm-12 mb-30">
                        <div class="card-box height-100-p overflow-hidden">
                            <div class="profile-tab height-100-p">
                                <div class="tab height-100-p">
                                    <ul class="nav nav-tabs customtab" role="tablist">
                                        <li class="nav-item">
                                            <a
                                                    class="nav-link active"
                                                    data-toggle="tab"
                                                    href="#setting"
                                                    role="tab"
                                            >Đổi mật khẩu</a
                                            >
                                        </li>
                                    </ul>
                                    <div class="tab-content">
                                        <!-- Setting Tab start -->
                                        <div
                                                class="tab-pane fade show active"
                                                id="setting"
                                                role="tabpanel"
                                        >
                                            <div class="profile-setting">
                                                <form th:action="@{/dep/change-password}" method="post" id="change-password-form">
                                                    <div class="alert alert-danger text-center" th:if="${passwordError}" th:text="${passwordError}"></div>
                                                    <div class="alert alert-success text-center" th:if="${passwordSuccess}" th:text="${passwordSuccess}"></div>

                                                    <div class="alert alert-danger text-center" id="error-message" style="display: none">
                                                        Mật khẩu mới và mật khẩu nhập lại không khớp!
                                                    </div>

                                                    <ul class="profile-edit-list row">
                                                        <li class="weight-500 col-md-6">
                                                            <h4 class="text-blue h5 mb-20">
                                                                Đổi mật khẩu
                                                            </h4>
                                                            <div class="form-group">
                                                                <label>Mật khẩu hiện tại</label>
                                                                <input
                                                                        class="form-control form-control-lg"
                                                                        type="password" name="currentPassword" id="currentPassword"
                                                                />
                                                            </div>
                                                            <div class="form-group">
                                                                <label>Mật khẩu mới</label>
                                                                <input
                                                                        class="form-control form-control-lg"
                                                                        type="password" name="newPassword" id="newPassword"
                                                                />
                                                            </div>
                                                            <div class="form-group">
                                                                <label>Nhập lại</label>
                                                                <input
                                                                        class="form-control form-control-lg"
                                                                        type="password" name="rePassword" id="rePassword"
                                                                />
                                                            </div>
                                                            <div class="form-group mb-0">
                                                                <input
                                                                        type="submit"
                                                                        class="btn btn-primary"
                                                                        value="Lưu"
                                                                />
                                                            </div>
                                                        </li>
                                                    </ul>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </th:block>
</th:block>
</body>

<script>
    document.getElementById("change-password-form").addEventListener("submit", function(event) {
    var newPassword = document.getElementById("newPassword").value;
    var rePassword = document.getElementById("rePassword").value;
    var errorMessage = document.getElementById("error-message");

    if (newPassword !== rePassword) {
        event.preventDefault();

        errorMessage.style.display = "block";
    } else {
        errorMessage.style.display = "none";
    }
});

</script>
</html>
